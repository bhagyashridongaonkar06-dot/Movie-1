    <div class="backdrop closemodel" id="backdrop"></div>
    <div class="container m-4" class="closemodel" id="model">
        <!-- <div class="row"> -->
        <!-- <div class="col-12"> -->
        <form action="" class="movieForm" id="movieForm">
            <div class="card text-white">
                <div class="card-header d-flex justify-content-between sec-btn">
                    <h4 class="m-0">Add Moive</h4>
                    <i class="fa-solid fa-xmark-square fa-2x closemodel text-dark"></i>
                </div>

                <div class="card-body text-dark">
                    <div class="form-row">
                        <div class="col-12">
                            <label for="title">Movie Title<span class="text-danger">* :</span></label>
                            <input type="text" class="form-control mb-2" id="title" placeholder="Enter Movie Name">
                        </div>

                        <div class="col-12">
                            <label for="poster">Poster<span class="text-danger">* :</span></label>
                            <input type="text" class="form-control mb-2" placeholder="Enter Poster Url" id="poster">
                        </div>

                        <div class="col-2">
                            <label for="rating">Rating<span class="text-danger">* :</span></label>
                            <select class="form-control" id="rating">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>

                        <div class="col-4 offset-1">
                            <label for="genres">Genere<span class="text-danger">* :</span></label>
                            <select class="form-control" id="genres">
                                <option value="Action">Action</option>
                                <option value="Adventure">Adventure</option>
                                <option value="Comedy">Comedy</option>
                                <option value="Drama">Drama</option>
                                <option value="Thriller">Thriller</option>
                                <option value="Horror">Horror</option>
                                <option value="Sci-fi">Sci-fi</option>
                                <option value="Animation">Animation</option>

                            </select>
                        </div>

                        <div class="col-4 offset-1">
                            <label for="releaseDate">Release Date<span class="text-danger">* :</span></label>
                            <input type="date" class="form-control" placeholder="Enter releaseDate Url"
                                id="releaseDate">
                        </div>

                        <div class="col-12">
                            <label for="description">Movie Description<span class="text-danger">* :</span></label>
                            <textarea type="" class="form-control" rows="2" placeholder="Enter description Url"
                                id="description"></textarea>
                        </div>
                    </div>
                </div>

                <div class="card-footer d-flex justify-content-between align-items-center sec-btn">
                    <button type="submit" class="btn btn-outline pri-btn" id="addMovie">Add Movie</button>
                    <button type="button" class="btn btn-outline pri-btn d-none" id="updateMovie">Update Movie</button>
                    <button type="button" class="btn closemodel btn-outline pri-btn">Cancel</button>
                </div>
            </div>
        </form>
